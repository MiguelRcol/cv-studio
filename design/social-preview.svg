    <rect x="23" y="314" width="76" height="6" rx="3" fill="#334138" opacity=".55"/>
    <rect x="23" y="329" width="64" height="5" rx="2.5" fill="#8c958d" opacity=".28"/>
    <rect x="23" y="342" width="51" height="5" rx="2.5" fill="#8c958d" opacity=".2"/>

