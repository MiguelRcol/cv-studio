    <rect x="153" y="207" width="211" height="5" rx="2.5" fill="#59635d" opacity=".24"/>
    <rect x="153" y="220" width="148" height="5" rx="2.5" fill="#59635d" opacity=".24"/>
    <line x1="153" y1="252" x2="361" y2="252" stroke="#e4e5de"/>
    <text x="153" y="286" fill="#2b3c33" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="8" font-weight="700" letter-spacing="1.5">EXPERIENCE</text>
    <line x1="160" y1="309" x2="160" y2="473" stroke="#d5d9d2"/>
    <circle cx="160" cy="316" r="5" fill="#f0a58e"/>
    <rect x="177" y="310" width="108" height="7" rx="3.5" fill="#2b3730" opacity=".68"/>
    <rect x="177" y="327" width="72" height="5" rx="2.5" fill="#69736d" opacity=".35"/>
    <rect x="177" y="352" width="169" height="5" rx="2.5" fill="#606a64" opacity=".24"/>
    <rect x="177" y="365" width="153" height="5" rx="2.5" fill="#606a64" opacity=".24"/>
    <rect x="177" y="378" width="177" height="5" rx="2.5" fill="#606a64" opacity=".24"/>
    <circle cx="160" cy="419" r="5" fill="#f0a58e"/>
    <rect x="177" y="413" width="91" height="7" rx="3.5" fill="#2b3730" opacity=".68"/>
    <rect x="177" y="430" width="64" height="5" rx="2.5" fill="#69736d" opacity=".35"/>
    <rect x="177" y="455" width="181" height="5" rx="2.5" fill="#606a64" opacity=".24"/>
    <rect x="177" y="468" width="141" height="5" rx="2.5" fill="#606a64" opacity=".24"/>
