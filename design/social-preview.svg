<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title description">
  <title id="title">CV Studio social preview</title>
  <desc id="description">A green and cream presentation card with a miniature résumé layout.</desc>
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="20" stdDeviation="22" flood-color="#14241c" flood-opacity=".2"/>
    </filter>
    <linearGradient id="glow" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f9f8f3"/>
      <stop offset="1" stop-color="#e9ece2"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="630" fill="url(#glow)"/>
  <circle cx="1120" cy="80" r="230" fill="#d8ee9f" opacity=".28"/>
  <circle cx="70" cy="625" r="185" fill="#f0a58e" opacity=".12"/>

  <g transform="translate(82 76)">
    <rect width="52" height="52" rx="15" fill="#284b3b"/>
    <text x="26" y="36" fill="#fff" font-family="Georgia, serif" font-size="28" font-style="italic" text-anchor="middle">C</text>
    <text x="69" y="34" fill="#1a241f" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="23" font-weight="700">CV Studio</text>

    <text x="0" y="151" fill="#748078" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="14" font-weight="700" letter-spacing="2.2">YOUR STORY, CLEARLY TOLD</text>
    <text x="0" y="215" fill="#1a241f" font-family="Georgia, serif" font-size="55">Build a résumé</text>
    <text x="0" y="276" fill="#1a241f" font-family="Georgia, serif" font-size="55">that feels like you.</text>
    <text x="0" y="329" fill="#66706a" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="20">A thoughtful editor with a polished,</text>
    <text x="0" y="358" fill="#66706a" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="20">print-ready preview.</text>

    <g transform="translate(0 410)">
      <rect width="196" height="52" rx="26" fill="#284b3b"/>
      <text x="98" y="33" fill="#fff" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="16" font-weight="700" text-anchor="middle">Edit · Save · Print</text>
    </g>
  </g>

  <g transform="translate(705 48)" filter="url(#shadow)">
    <rect width="390" height="534" fill="#fffefa"/>
    <rect width="390" height="126" fill="#284b3b"/>
    <circle cx="61" cy="62" r="34" fill="none" stroke="#d8ee9f" stroke-opacity=".72" stroke-width="2"/>
    <text x="61" y="72" fill="#d8ee9f" font-family="Georgia, serif" font-size="28" font-style="italic" text-anchor="middle">MC</text>
    <text x="115" y="51" fill="#becdc3" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="8" letter-spacing="1.8">CURRICULUM VITAE</text>
